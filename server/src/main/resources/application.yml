spring:
  application:
    name: topic-scope
  main:
    # MCP runs over stdin/stdout. Anything else printed to stdout breaks the protocol.
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        stdio: true
        name: topic-scope
        version: 0.1.0
        type: SYNC
        instructions: >-
          Read-only view of Kafka and MQTT brokers: topics, recent messages and lag.
          Nothing here can publish, commit offsets or change a broker.
          Start with list_sources to see which brokers are configured.
        capabilities:
          resource: false
          prompt: false
          completion: false

# The brokers the server may look at. These defaults are the local stack from compose.yaml.
# To look elsewhere, put your own list in a file and start the server with
#   --spring.config.additional-location=file:/path/to/topic-scope.yml
topic-scope:
  probe-timeout: 5s      # list_sources: how long to wait for a broker to answer
  request-timeout: 10s   # every other tool: how long one question to a broker may take
  limits:                # hard caps on message content; a caller cannot raise them
    max-messages: 100      # most messages one call returns
    max-value-chars: 2000  # most characters shown of one value
    max-total-chars: 40000 # most characters of values in one answer
  audit:                 # one line per tool call: when, which tool, which arguments, how it ended. Never message content
    enabled: ${TOPIC_SCOPE_AUDIT:true}
    file: ${TOPIC_SCOPE_AUDIT_FILE:${user.home}/.topic-scope/audit.jsonl}
  sources:
    - name: local-kafka
      type: kafka
      address: ${TOPIC_SCOPE_KAFKA:localhost:9092}
      username: ${TOPIC_SCOPE_KAFKA_USERNAME:}
      password: ${TOPIC_SCOPE_KAFKA_PASSWORD:}
    - name: local-mqtt
      type: mqtt
      address: ${TOPIC_SCOPE_MQTT:tcp://localhost:1883}
      username: ${TOPIC_SCOPE_MQTT_USERNAME:}
      password: ${TOPIC_SCOPE_MQTT_PASSWORD:}
