# The local stack: one Kafka broker, one MQTT broker, and a simulator that fills them with known demo data.
#
#   docker compose up -d --build --wait      seed, then keep sample traffic flowing
#   SIM_MODE=seed docker compose up -d --build   seed only: the state stays exactly as DemoData.java describes
#   docker compose down -v                   stop and forget everything
#
# Every port is published on 127.0.0.1 only. Nothing here is reachable from the network.

name: topic-scope

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # A single node that is broker and controller at once (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST is for programs on this machine (localhost:9092), INTERNAL for other containers (kafka:19092).
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Only the simulator creates topics, so a typo in a topic name is an error and not a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      MQTT_URI: tcp://mosquitto:1883
      SIM_MODE: ${SIM_MODE:-all}
      SIM_SILENT_AFTER_SECONDS: ${SIM_SILENT_AFTER_SECONDS:-60}
    # In seed mode the simulator exits with 0 when it is done; that must not count as a failure.
    restart: "no"
