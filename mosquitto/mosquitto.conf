# Mosquitto for the local stack only. Used by compose.yaml and by the integration tests.
# Anonymous access is fine here because the port is published on 127.0.0.1 only.
# Phase 7 replaces it with accounts and a subscribe-only account for the server.

listener 1883
allow_anonymous true

# Nothing is written to disk: a restart gives an empty broker, and the simulator seeds it again.
persistence false

# Broker counters under $SYS/#, refreshed every 5 seconds.
sys_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
