# Mosquitto for the local stack (compose.yaml), with accounts.
#
#   simulator   publishes and subscribes: it fills the broker with demo data
#   topicscope  may only subscribe: this is the account the MCP server logs in with
#
# What each account may do is in the file "acl"; the passwords (hashed) are in "passwd".
# The passwords themselves are in compose.yaml. They protect nothing: the port is published on
# 127.0.0.1 only. They are there so that the stack shows the set-up a real broker should have.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Nothing is written to disk: a restart gives an empty broker, and the simulator seeds it again.
persistence false

# Broker counters under $SYS/#, refreshed every 5 seconds.
sys_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
