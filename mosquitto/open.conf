# Mosquitto without accounts, for the integration tests that are not about accounts.
# The local stack (compose.yaml) uses mosquitto.conf, which asks for a login.

listener 1883
allow_anonymous true

# Nothing is written to disk: a restart gives an empty broker, and the simulator seeds it again.
persistence false

# Broker counters under $SYS/#, refreshed every 5 seconds.
sys_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
