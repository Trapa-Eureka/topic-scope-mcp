# Login for Kafka's own command-line tools inside the local stack's container, as the account that may see everything.
# Mounted by compose.yaml at /etc/kafka-client/local-admin.properties. Use it to cross-check what the server reports:
#
#   docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 \
#     --command-config /etc/kafka-client/local-admin.properties --describe --all-groups
#
# The password is the local stack's demo password (see compose.yaml). It is not a secret and opens nothing else.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="simulator" password="simulator-local-only";
